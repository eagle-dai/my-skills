name: Apply blog paragraph flow edit

on:
  push:
    branches:
      - agent/improve-blog-paragraph-flow
    paths:
      - .github/workflows/apply-blog-flow.yml

permissions:
  contents: write

jobs:
  apply-edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Apply article-only patch
        shell: bash
        run: |
          echo '' | base64 --decode | gzip --decompress > /tmp/blog-flow.patch
          git apply /tmp/blog-flow.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/when-ai-skills-learn-and-forget.md
          git commit -m 'Improve technical blog paragraph flow'
          git push origin HEAD:${GITHUB_REF_NAME}
