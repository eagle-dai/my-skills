name: Tests
run-name: Tests · ${{ github.event_name }} · ${{ github.ref_name }}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    name: Python 3.13 unittest
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply PR 33 source transfer
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/skip-unchanged-formula-writes'
        run: |
          cat .pr33-transfer/chunk* > /tmp/pr33-changes.tar.gz.b64
          base64 --decode /tmp/pr33-changes.tar.gz.b64 > /tmp/pr33-changes.tar.gz
          echo 'c3e3d80f62cda704923fb2f6c71fbaa2c0ce0fd7a6becfdb2b49e0dd5d7a62ab  /tmp/pr33-changes.tar.gz' | sha256sum --check
          tar -xzf /tmp/pr33-changes.tar.gz
          rm -rf .pr33-transfer

      - name: Run tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Commit PR 33 source changes
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/skip-unchanged-formula-writes'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add html-to-markdown/formula_batch.py html-to-markdown/formula-batch.md html-to-markdown/pipeline.md tests/test_formula_batch.py tests/test_benchmark.py .pr33-transfer
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
          else
            git commit -m 'formula: skip unchanged warm-run writes'
            git push origin HEAD:agent/skip-unchanged-formula-writes
          fi
