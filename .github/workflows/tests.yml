name: Tests
run-name: Tests · ${{ github.event_name }} · ${{ github.ref_name }}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    name: Python 3.13 unittest
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -p 'test_*.py' -v > test-output.txt 2>&1
          status=$?
          cat test-output.txt
          exit $status

      - name: Upload unittest output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unittest-output
          path: test-output.txt
          if-no-files-found: error
