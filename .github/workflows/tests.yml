name: Tests
run-name: Tests · ${{ github.event_name }} · ${{ github.ref_name }}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    name: Python 3.13 unittest
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply one-time style cleanup
        if: github.actor != 'github-actions[bot]'
        run: python .github/patch_blog_style.py

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python run_tests.py

      - name: Commit cleaned article and remove temporary files
        if: success() && github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout origin/main -- .github/workflows/tests.yml
          rm .github/patch_blog_style.py
          git add docs/when-ai-skills-learn-and-forget.md .github/workflows/tests.yml .github/patch_blog_style.py
          git commit -m "Remove duplicate transition wording"
          git push origin HEAD:${{ github.head_ref }}
