name: Tests
run-name: Tests · ${{ github.event_name }} · ${{ github.ref_name }}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    name: Python 3.13 unittest
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply PR 32 source transfer
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/reuse-preflight-dom'
        run: |
          cat .pr32-transfer/chunk* > /tmp/pr32-changes.tar.gz.b64
          base64 --decode /tmp/pr32-changes.tar.gz.b64 > /tmp/pr32-changes.tar.gz
          echo '9b510323e61186124b70a63d057d291b350f0c3b13064a609902f25f490ea227  /tmp/pr32-changes.tar.gz' | sha256sum --check
          tar -xzf /tmp/pr32-changes.tar.gz
          rm -rf .pr32-transfer

      - name: Run tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Commit PR 32 source changes
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/reuse-preflight-dom'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add html-to-markdown/preflight.py html-to-markdown/pipeline.py html-to-markdown/formula_batch.py html-to-markdown/benchmark.py html-to-markdown/pipeline.md tests/test_benchmark.py tests/test_pipeline.py tests/test_preflight.py tests/test_formula_batch.py .pr32-transfer
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
          else
            git commit -m 'pipeline: reuse preflight DOM'
            git push origin HEAD:agent/reuse-preflight-dom
          fi
